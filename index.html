<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chicken Gun Minigame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #1a1a2e;
            background-image: url('https://raw.githubusercontent.com/FChickCG/ChickenGunTGBot.github.io/main/Textures/Background1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        .chicken {
            position: absolute;
            width: 100px;
            height: auto;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.1s ease;
            animation: chickenIdle 1.5s ease-in-out infinite;
        }

        .chicken:active {
            transform: scale(0.85);
        }

        .chicken.hit {
            animation: chickenDie 0.3s ease forwards;
            pointer-events: none;
        }

        .weapon {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 160px;
            height: auto;
            pointer-events: none;
            z-index: 100;
        }

        .score-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 200;
            pointer-events: none;
            opacity: 0;
        }

        .score-popup.show {
            animation: popUp 0.8s ease forwards;
        }

        .score-text {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 150;
            opacity: 0;
        }

        .score-text.show {
            animation: floatUp 0.8s ease forwards;
        }

        .combo-text {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: bold;
            color: #FF4444;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .combo-text.visible {
            opacity: 1;
        }

        .hud {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            pointer-events: none;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-close {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 60;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            pointer-events: all;
        }

        @keyframes chickenIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes chickenDie {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3) rotate(20deg); opacity: 0.7; }
            100% { transform: scale(0) rotate(90deg); opacity: 0; }
        }

        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(1); opacity: 0; }
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-60px); opacity: 0; }
        }

        @keyframes spawnChicken {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .chicken.spawning {
            animation: spawnChicken 0.3s ease forwards;
        }
    </style>
</head>
<body>
    <div class="hud">
        <div class="hud-item" id="kills">Киллы: 0</div>
        <div class="hud-item" id="combo"></div>
    </div>

    <button class="btn-close" id="btnClose">Закрыть</button>

    <div class="score-popup" id="scorePopup"></div>
    <div class="combo-text" id="comboText"></div>

    <img class="weapon" src="https://raw.githubusercontent.com/FChickCG/ChickenGunTGBot.github.io/main/Textures/Weapon1.png" alt="weapon">
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let totalKills = 0;
        let pendingKills = 0;
        let combo = 0;
        let comboTimer = null;
        let lastKillTime = 0;

        const chickenImg = document.createElement('img');
        chickenImg.className = 'chicken';
        chickenImg.src = 'https://raw.githubusercontent.com/FChickCG/ChickenGunTGBot.github.io/main/Textures/ChickenEnemy.png';
        chickenImg.alt = 'chicken';

        function sendPendingKills() {
            if (pendingKills <= 0) return;
            try {
                tg.sendData(JSON.stringify({ action: 'kill', count: pendingKills }));
                pendingKills = 0;
            } catch (err) {
                console.error('sendData error:', err);
            }
        }

        function spawnChicken() {
            const existing = document.querySelector('.chicken');
            if (existing && !existing.classList.contains('hit')) return;

            const c = chickenImg.cloneNode(true);
            c.classList.remove('hit', 'spawning');
            void c.offsetWidth;
            c.classList.add('spawning');

            const maxX = window.innerWidth - 100;
            const maxY = window.innerHeight - 120;
            const x = Math.random() * maxX;
            const y = Math.random() * (maxY - 80) + 80;

            c.style.left = x + 'px';
            c.style.top = y + 'px';

            c.addEventListener('click', onChickenClick);
            c.addEventListener('touchstart', function(e) {
                e.preventDefault();
                onChickenClick(e);
            }, { passive: false });

            document.body.appendChild(c);
        }

function onChickenClick(e) {
    e.preventDefault();
    e.stopPropagation();

    const target = e.currentTarget || e.target.closest('.chicken');
    if (!target || target.classList.contains('hit')) return;

    target.classList.add('hit');

    totalKills++;
    pendingKills++;

    const now = Date.now();
    if (now - lastKillTime < 2000) {
        combo++;
    } else {
        combo = 1;
    }
    lastKillTime = now;

    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => {
        combo = 0;
        document.getElementById('combo').textContent = '';
        document.getElementById('combo').classList.remove('visible');
    }, 2000);

    if (combo > 1) {
        const comboEl = document.getElementById('combo');
        comboEl.textContent = 'x' + combo + ' COMBO!';
        comboEl.classList.add('visible');
    }

    const isPremium = tg.initDataUnsafe?.user?.is_premium || false;
    const coins = isPremium ? 20 : 10;

    showFloatingScore(target, '+' + coins);
    document.getElementById('kills').textContent = 'Киллы: ' + totalKills;

    setTimeout(() => {
        target.remove();
        spawnChicken();
    }, 350);
}

        function showFloatingScore(element, text) {
            const rect = element.getBoundingClientRect();
            const el = document.createElement('div');
            el.className = 'score-text';
            el.textContent = text;
            el.style.left = (rect.left + rect.width / 2 - 20) + 'px';
            el.style.top = (rect.top - 10) + 'px';
            document.body.appendChild(el);

            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => el.remove(), 800);
        }

        document.getElementById('btnClose').addEventListener('click', () => {
            sendPendingKills();
            setTimeout(() => tg.close(), 200);
        });

        window.addEventListener('beforeunload', () => {
            sendPendingKills();
        });

        tg.MainButton.setParams({ is_visible: false });

        spawnChicken();
    </script>
</body>
</html>
